<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yuzu Jukebox</title>
  <script src="config.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script>
    // 首帧前落 scheme，避免刷白/刷黑：本机锁定 > config.js 指定 > 内置默认深色
    (function () {
      try {
        var saved = localStorage.getItem('yuzu-scheme');
        var cfg = (globalThis.YUZU_CONFIG && YUZU_CONFIG.scheme) || '';
        document.documentElement.dataset.scheme = saved || cfg || 'dark';
      } catch (_) {
        document.documentElement.dataset.scheme = 'dark';
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
