<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yuzu Jukebox</title>
  <script src="config.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script>
    // 首帧前落 scheme，避免刷白/刷黑：本机锁定 > config.js 指定 > 内置默认深色
    (function () {
      try {
        document.documentElement.dataset.skin = localStorage.getItem('yuzu-skin') === 'scarlet' ? 'scarlet' : 'default';
        var saved = localStorage.getItem('yuzu-scheme');
        var cfg = (globalThis.YUZU_CONFIG && YUZU_CONFIG.scheme) || '';
        document.documentElement.dataset.scheme = saved || cfg || 'dark';
      } catch (_) {
        document.documentElement.dataset.scheme = 'dark';
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
